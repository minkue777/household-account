# Include inside the existing HTTPS server block. Replace the token before
# installation and keep the rendered file root-owned with mode 0600.
location = /household-fund-nav/ew001 {
    if ($request_method != GET) { return 405; }
    if ($http_authorization != "Bearer REPLACE_WITH_FUND_NAV_RELAY_TOKEN") { return 401; }
    if ($args != "") { return 400; }

    # A single upstream and class: callers cannot choose a URL or query string.
    proxy_pass https://investments.miraeasset.com/magi/fund/basePrices.do?fundGb=2&fundCd=539502&period=1M;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host investments.miraeasset.com;
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 HouseholdAccount/1.0";
    proxy_set_header Accept "text/html,application/xhtml+xml";
    proxy_set_header Content-Length "";

    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_next_upstream off;
    proxy_redirect off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

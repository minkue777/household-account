server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/lib/household-fund-nav/www;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/household-fund-nav/tls/fullchain.pem;
    ssl_certificate_key /etc/household-fund-nav/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FundNavTLS:1m;
    ssl_session_timeout 10m;

    include /etc/household-fund-nav/relay.conf;
    location / { return 404; }
}

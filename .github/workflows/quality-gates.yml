name: 품질 게이트

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm run test:types
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: node -e "require('./lib/index.js')"
        working-directory: functions
      - run: npm run test:runtime-boundaries
        working-directory: functions
      - run: npm install --global firebase-tools@15.4.0
      - run: npm run test:callable-integration
        working-directory: functions
      - run: npm run test:firestore-rules
        working-directory: functions
      - run: npm run test:storage-rules
        working-directory: functions
      - run: npm run test:firebase-integration
        working-directory: functions

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test -- --runInBand
        working-directory: web
      - run: npm run build
        working-directory: web

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: functions
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-failure
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
        working-directory: android
      - run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
        working-directory: android

  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: KVM 사용 권한 활성화
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
        working-directory: android
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 2147483647
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            cd android
            status=0
            ./gradlew connectedDebugAndroidTest --stacktrace || status=$?
            mkdir -p app/build/ci-diagnostics
            adb logcat -d > app/build/ci-diagnostics/logcat.txt || true
            adb exec-out screencap -p > app/build/ci-diagnostics/screen.png || true
            exit "$status"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-failure
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            android/app/build/ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

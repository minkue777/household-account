name: Linux WebKit 인과 진단 전용 (성능 합격 판정 아님)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-diagnostic:
    name: 실제 에뮬레이터와 production build의 조건별 원본 측정
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            web/package-lock.json
            functions-payment-capture/package-lock.json
            functions-access-session/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions
      - run: npm ci --prefix web
      - run: npm ci --prefix functions-payment-capture
      - run: npm ci --prefix functions-access-session
      - run: npx playwright install --with-deps webkit
        working-directory: web
      - name: 실제 Functions 3개 코드베이스 준비
        run: npm --prefix web run test:e2e:functions
      - name: 진단만 실행 (시간 예산 PASS/FAIL 판정 및 배포 없음)
        run: >-
          node functions/scripts/run-with-emulator-secret.mjs
          node tools/e2e/firebase-emulators.mjs
          "npm --prefix web run test:performance:playwright -- --config playwright.frame-diagnostic.config.ts"
        env:
          PERFORMANCE_PHASE_DIAGNOSTICS: 'true'
          PERFORMANCE_DIAGNOSTIC: 'true'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-webkit-frame-diagnostic
          path: web/performance-results
          if-no-files-found: warn
          retention-days: 14
